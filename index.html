<!DOCTYPE html>
<html lang="en" class="dark">
<head>

  <meta name="theme-color" content="#0b0f17" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Self-paced Digital Marketing, Ad Operations, and Programmatic Ad Tech Technical Trainer" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          },
          colors: {
            void: '#0b0f17',
            surface: '#131a29',
            elevated: '#192236',
            borderline: '#1f2a40',
            cyanaccent: '#38bdf8',
            emeraldaccent: '#10b981',
            amberaccent: '#f59e0b',
            roseaccent: '#f43f5e'
          }
        }
      }
    };
  </script>
  <style>
    :root {
      --bg-void: #0b0f17;
      --bg-surface: #131a29;
      --bg-elevated: #192236;
      --border-subtle: #1f2a40;
      --accent-cyan: #38bdf8;
      --accent-emerald: #10b981;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-void);
      color: #f1f5f9;
      font-family: 'Inter', system-ui, sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* Custom subtle scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0b0f17;
    }
    ::-webkit-scrollbar-thumb {
      background: #1f2a40;
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }

    .card-tile {
      background: linear-gradient(180deg, rgba(25, 34, 54, 0.72) 0%, rgba(19, 26, 41, 0.96) 100%);
      border: 1px solid #1f2a40;
      border-radius: 1rem;
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    }

    .card-tile:hover {
      border-color: rgba(56, 189, 248, 0.45);
      box-shadow: 0 10px 28px -10px rgba(0, 0, 0, 0.65);
    }

    .card-tile:active {
      transform: scale(0.992);
    }

    .bottom-nav-blur {
      background: rgba(11, 15, 23, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid #1f2a40;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    .header-blur {
      background: rgba(11, 15, 23, 0.9);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid #1f2a40;
      padding-top: env(safe-area-inset-top, 0px);
    }

    .fade-in {
      animation: fadeIn 0.22s ease-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-void text-slate-100 antialiased selection:bg-sky-500/30 selection:text-sky-200">

      <!-- Global Instant Search Bar -->
      <div class="relative mt-2.5">
        <div class="relative flex items-center">
          <svg class="w-4 h-4 text-slate-400 absolute left-3.5 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11A6 6 0 115 11a6 6 0 0112 0z" />
          </svg>
          <input
            id="global-search-input"
            type="text"
            placeholder="Search jargons (DSP, SSP, VAST, CPM), formulas, or lessons..."

          />

        </div>

        <!-- Instant Search Results Dropdown -->
        <div id="global-search-results" class="hidden absolute left-0 right-0 mt-1.5 bg-surface border border-borderline rounded-2xl shadow-2xl max-h-80 overflow-y-auto z-50 divide-y divide-borderline/70"></div>

  <!-- MODAL FOR ADDING ON-DEMAND CUSTOM MODULE -->
  <div id="custom-module-modal" class="hidden fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-end sm:items-center justify-center p-4">
    <div class="bg-surface border border-borderline rounded-2xl w-full max-w-lg p-5 shadow-2xl fade-in">
      <div class="flex items-center justify-between mb-4">
        <div>
          <h3 class="text-lg font-bold text-white">Add On-Demand Learning Module</h3>
          <p class="text-xs text-slate-400">Expand your permanent syllabus with custom topics or client SOPs</p>
        </div>
        <button onclick="closeCustomModuleModal()" class="p-2 rounded-xl bg-elevated text-slate-400 hover:text-white">✕</button>
      </div>

      <form onsubmit="handleCreateCustomModule(event)" class="space-y-3.5">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Target Track</label>
          <select id="custom-track-select" class="w-full bg-void border border-borderline rounded-xl px-3 py-2.5 text-sm text-white focus:border-sky-400 focus:outline-none"></select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Lesson Title</label>
          <input id="custom-lesson-title" type="text" required placeholder="e.g., DV360 Floodlight Tag Troubleshooting" class="w-full bg-void border border-borderline rounded-xl px-3 py-2.5 text-sm text-white focus:border-sky-400 focus:outline-none" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Plain-English Summary & Real Example</label>
          <textarea id="custom-lesson-summary" rows="3" required placeholder="Explain what this concept does in plain English and give a concrete example..." class="w-full bg-void border border-borderline rounded-xl px-3 py-2.5 text-sm text-white focus:border-sky-400 focus:outline-none"></textarea>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Key Steps / Operational Rules (one per line)</label>
          <textarea id="custom-lesson-steps" rows="3" placeholder="1. Verify pixel fires on confirmation page&#10;2. Check attribution window settings&#10;3. Audit discrepancy threshold (<5%)" class="w-full bg-void border border-borderline rounded-xl px-3 py-2.5 text-sm text-white focus:border-sky-400 focus:outline-none"></textarea>

              sizes: "512x512",
              type: "image/svg+xml",
              purpose: "any maskable"
            }
          ]
        };
        const blob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
        const link = document.createElement("link");
        link.rel = "manifest";
        link.href = URL.createObjectURL(blob);
        document.head.appendChild(link);
      } catch (e) {
        console.warn("Manifest setup skipped:", e);
      }
    })();

    /* =========================================================================
       5. STATE MANAGEMENT & LOCALSTORAGE PERSISTENCE
       ========================================================================= */
    const STORAGE_KEY = "adops_mastery_academy_v1";

    const DEFAULT_STATE = {
      activeTab: "home",
      activeTrackId: null,
      activeLessonId: null,
      lastViewedLessonId: "t1-l1",
      completedLessons: [],
      bookmarkedLessons: [],
      lessonNotes: {},
      quizScores: {},
      practiceCompleted: [],
      customLessons: [],
      streakDays: 1,
      lastActiveDate: new Date().toISOString().slice(0, 10),
      vaultFilter: "All"
    };

    let appState = loadState();

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return { ...DEFAULT_STATE };
        const parsed = JSON.parse(raw);
        const merged = { ...DEFAULT_STATE, ...parsed };

        // Update daily streak gracefully
        const today = new Date().toISOString().slice(0, 10);
        if (merged.lastActiveDate !== today) {
          const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
          merged.streakDays = merged.lastActiveDate === yesterday ? (merged.streakDays || 1) + 1 : 1;
          merged.lastActiveDate = today;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(merged));
        }
        return merged;
      } catch (e) {
        console.warn("Failed to load localStorage state:", e);
        return { ...DEFAULT_STATE };
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
        updateHeaderMetrics();
      } catch (e) {
        showToast("Storage warning: could not save locally.", "rose");
      }
    }

    function getFullCurriculum() {
      // Deep clone base curriculum and append user's custom on-demand lessons
      const tracks = BASE_CURRICULUM.map(t => ({
        ...t,
        lessons: [...t.lessons]
      }));

      (appState.customLessons || []).forEach(cl => {
        const targetTrack = tracks.find(t => t.id === cl.trackId) || tracks[0];
        targetTrack.lessons.push(cl.lesson);
      });

      return tracks;
    }

    function getAllLessonsFlat() {
      const tracks = getFullCurriculum();
      const flat = [];
      tracks.forEach(track => {
        track.lessons.forEach(lesson => {
          flat.push({ ...lesson, trackId: track.id, trackTitle: track.title, trackNumber: track.number, trackLevel: track.level });
        });
      });
      return flat;
    }

    function findLessonById(lessonId) {
      return getAllLessonsFlat().find(l => l.id === lessonId) || getAllLessonsFlat()[0];
    }

    function updateHeaderMetrics() {
      const all = getAllLessonsFlat();
      const completedCount = appState.completedLessons.filter(id => all.some(l => l.id === id)).length;
      const pct = all.length ? Math.round((completedCount / all.length) * 100) : 0;
      const pctEl = document.getElementById("header-progress-pct");
      const streakEl = document.getElementById("streak-count");
      if (pctEl) pctEl.textContent = `${pct}%`;
      if (streakEl) streakEl.textContent = `${appState.streakDays || 1}d`;
    }

      el.className = `pointer-events-auto px-3.5 py-2.5 rounded-xl border shadow-xl text-xs font-semibold flex items-center justify-between gap-2 fade-in ${colorMap[tone] || colorMap.sky}`;
      el.innerHTML = `<span>${message}</span>`;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = "0";

    function switchTab(tab, options = {}) {
      appState.activeTab = tab;
      if (options.trackId !== undefined) appState.activeTrackId = options.trackId;
      if (options.lessonId !== undefined) {
        appState.activeLessonId = options.lessonId;
        if (options.lessonId) {
          appState.lastViewedLessonId = options.lessonId;
        }
      } else if (tab !== "lesson") {
        appState.activeLessonId = null;
      }

      saveState();
      updateBottomNavUI();
      renderCurrentView();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function updateBottomNavUI() {
      const current = appState.activeTab === "lesson" ? "roadmap" : appState.activeTab;
      document.querySelectorAll(".nav-btn").forEach(btn => {
        const navKey = btn.getAttribute("data-nav");
        if (navKey === current) {
          btn.classList.remove("text-slate-400");
          btn.classList.add("text-sky-400", "bg-sky-500/10");
        } else {
          btn.classList.remove("text-sky-400", "bg-sky-500/10");
          btn.classList.add("text-slate-400");
        }
      });
    }

    function renderCurrentView() {
      const container = document.getElementById("view-container");
      if (!container) return;

      container.classList.remove("fade-in");
      void container.offsetWidth; // trigger reflow for smooth animation
      container.classList.add("fade-in");

      if (appState.activeTab === "lesson" && appState.activeLessonId) {
        container.innerHTML = renderLessonReaderView(appState.activeLessonId);
        return;
      }

      switch (appState.activeTab) {
        case "home":
          container.innerHTML = renderHomeHubView();
          break;
        case "roadmap":
          container.innerHTML = renderRoadmapView();
          break;
        case "vault":
          container.innerHTML = renderVaultView();
          attachCalculatorListeners();
          break;
        case "lab":
          container.innerHTML = renderPracticeLabView();
          break;
        case "progress":
          container.innerHTML = renderProgressView();
          break;
        default:
          container.innerHTML = renderHomeHubView();
      }
    }

    function submitLessonQuiz(lessonId, selectedIdx) {
      const lesson = findLessonById(lessonId);
      if (!lesson || !lesson.quiz) return;
      const isCorrect = selectedIdx === lesson.quiz.correctIndex;

      appState.quizScores[lessonId] = isCorrect;
      if (isCorrect && !appState.completedLessons.includes(lessonId)) {
        appState.completedLessons.push(lessonId);
      }
      saveState();

      const fb = document.getElementById("lesson-quiz-feedback");
      if (fb) {
        fb.classList.remove("hidden");
        fb.className = `p-3.5 rounded-xl text-xs leading-relaxed border ${isCorrect ? 'bg-emerald-500/15 border-emerald-500/40 text-emerald-200' : 'bg-rose-500/15 border-rose-500/40 text-rose-200'}`;
        fb.innerHTML = `<strong>${isCorrect ? "✓ Correct!" : "✕ Not quite."}</strong> ${lesson.quiz.explanation}`;
      }
      showToast(isCorrect ? "Quiz passed & lesson marked complete!" : "Review the explanation and try again.", isCorrect ? "emerald" : "amber");
    }

    function toggleLessonComplete(lessonId) {
      const idx = appState.completedLessons.indexOf(lessonId);
      if (idx === -1) {
        appState.completedLessons.push(lessonId);
        showToast("Lesson marked complete!", "emerald");
      } else {
        appState.completedLessons.splice(idx, 1);
        showToast("Marked as incomplete.", "sky");
      }
      saveState();
      renderCurrentView();
    }

    function completeAndNext(currentId, nextId) {
      if (!appState.completedLessons.includes(currentId)) {
        appState.completedLessons.push(currentId);
      }
      openLesson(nextId);
    }

    function toggleBookmark(lessonId) {
      const idx = appState.bookmarkedLessons.indexOf(lessonId);
      if (idx === -1) {
        appState.bookmarkedLessons.push(lessonId);
        showToast("Bookmarked for quick revision.", "amber");
      } else {
        appState.bookmarkedLessons.splice(idx, 1);
        showToast("Bookmark removed.", "sky");
      }
      saveState();
      renderCurrentView();
    }

    function handleSaveLessonNote(lessonId, text) {
      appState.lessonNotes[lessonId] = text;
      saveState();
      const status = document.getElementById("note-save-status");
      if (status) status.textContent = "Saved ✓";
    }

              <div class="p-2.5 rounded-xl bg-void border border-borderline">
                <div class="text-[10px] font-mono text-slate-400">CTR</div>
                <div id="out-ctr" class="text-sm font-mono font-bold text-sky-400">1.50%</div>
              </div>
              <div class="p-2.5 rounded-xl bg-void border border-borderline">
                <div class="text-[10px] font-mono text-slate-400">CPC</div>
                <div id="out-cpc" class="text-sm font-mono font-bold text-sky-400">$0.32</div>
              </div>
              <div class="p-2.5 rounded-xl bg-void border border-borderline">
                <div class="text-[10px] font-mono text-slate-400">CVR</div>
                <div id="out-cvr" class="text-sm font-mono font-bold text-emerald-400">1.28%</div>
              </div>
              <div class="p-2.5 rounded-xl bg-void border border-borderline">
                <div class="text-[10px] font-mono text-slate-400">CPA</div>
                <div id="out-cpa" class="text-sm font-mono font-bold text-emerald-400">$25.00</div>
              </div>
              <div class="p-2.5 rounded-xl bg-void border border-borderline">
                <div class="text-[10px] font-mono text-slate-400">ROAS</div>
                <div id="out-roas" class="text-sm font-mono font-bold text-amber-400">3.20x</div>
              </div>
            </div>
          </section>

          <!-- Glossary Header & Category Filters -->
          <section class="space-y-3">
            <div>
              <h2 class="text-lg font-extrabold text-white">Jargon &amp; Formula Reference Vault (${filtered.length})</h2>
              <p class="text-xs text-slate-400">Filter by operational domain for instant formula lookup</p>
            </div>

            <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1">
              ${pillsHTML}
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
              ${cardsHTML}
            </div>
          </section>
        </div>
      `;
    }

    function setVaultFilter(cat) {
      appState.vaultFilter = cat;
      saveState();
      renderCurrentView();
    }

    function attachCalculatorListeners() {
      const ids = ["calc-spend", "calc-imps", "calc-clicks", "calc-convs", "calc-rev"];
      ids.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.addEventListener("input", runAdOpsCalculator);
      });
      runAdOpsCalculator();
    }

    function resetCalculatorDefaults() {
      document.getElementById("calc-spend").value = 1200;
      document.getElementById("calc-imps").value = 250000;
      document.getElementById("calc-clicks").value = 3750;
      document.getElementById("calc-convs").value = 48;
      document.getElementById("calc-rev").value = 3840;
      runAdOpsCalculator();
    }

    function runAdOpsCalculator() {
      const spend = parseFloat(document.getElementById("calc-spend")?.value) || 0;
      const imps = parseFloat(document.getElementById("calc-imps")?.value) || 0;
      const clicks = parseFloat(document.getElementById("calc-clicks")?.value) || 0;
      const convs = parseFloat(document.getElementById("calc-convs")?.value) || 0;
      const rev = parseFloat(document.getElementById("calc-rev")?.value) || 0;

      const cpm = imps > 0 ? (spend / imps) * 1000 : 0;
      const ctr = imps > 0 ? (clicks / imps) * 100 : 0;
      const cpc = clicks > 0 ? spend / clicks : 0;
      const cvr = clicks > 0 ? (convs / clicks) * 100 : 0;
      const cpa = convs > 0 ? spend / convs : 0;
      const roas = spend > 0 ? rev / spend : 0;

      if (document.getElementById("out-cpm")) document.getElementById("out-cpm").textContent = `$${cpm.toFixed(2)}`;
      if (document.getElementById("out-ctr")) document.getElementById("out-ctr").textContent = `${ctr.toFixed(2)}%`;
      if (document.getElementById("out-cpc")) document.getElementById("out-cpc").textContent = `$${cpc.toFixed(2)}`;
      if (document.getElementById("out-cvr")) document.getElementById("out-cvr").textContent = `${cvr.toFixed(2)}%`;
      if (document.getElementById("out-cpa")) document.getElementById("out-cpa").textContent = convs > 0 ? `$${cpa.toFixed(2)}` : "—";
      if (document.getElementById("out-roas")) document.getElementById("out-roas").textContent = `${roas.toFixed(2)}x`;
    }

    /* =========================================================================
       12. VIEW 5: PRACTICE LAB (WAR-ROOM SCENARIOS & ADAPTIVE QUIZ)
       ========================================================================= */
    let currentRandomQuiz = null;

    function generateRandomQuizQuestion() {
      const lessonsWithQuiz = getAllLessonsFlat().filter(l => l.quiz);
      if (!lessonsWithQuiz.length) return null;
      const pick = lessonsWithQuiz[Math.floor(Math.random() * lessonsWithQuiz.length)];
      return pick;
    }

    function renderPracticeLabView() {
      if (!currentRandomQuiz) {
        currentRandomQuiz = generateRandomQuizQuestion();
      }

      const solvedSet = new Set(appState.practiceCompleted || []);

      const scenariosHTML = WAR_ROOM_SCENARIOS.map(sc => {
        const isSolved = solvedSet.has(sc.id);
        return `
          <div class="card-tile p-4 sm:p-5 space-y-3">
            <div class="flex items-center justify-between gap-2">
              <div class="flex items-center gap-2">
                <span class="text-[11px] font-mono uppercase px-2 py-0.5 rounded bg-amber-500/15 text-amber-300 border border-amber-500/30">${sc.tag}</span>
                <span class="text-[11px] text-slate-400">Severity: ${sc.severity}</span>
              </div>
              ${isSolved ? '<span class="text-xs font-bold text-emerald-400">✓ Resolved</span>' : ''}
            </div>

            <h3 class="text-base font-extrabold text-white">${sc.title}</h3>
            <p class="text-xs sm:text-sm text-slate-300 leading-relaxed bg-void/80 p-3 rounded-xl border border-borderline">${sc.context}</p>
            <p class="text-xs font-bold text-sky-300">${sc.question}</p>

            <div class="space-y-2">
              ${sc.choices.map((ch, idx) => `
                <button onclick="evaluateWarRoomChoice('${sc.id}', ${idx})" class="w-full text-left p-3 rounded-xl bg-void hover:bg-elevated border border-borderline text-xs sm:text-sm text-slate-200 transition">
                  ${ch.text}
                </button>
              `).join("")}
            </div>

            <div id="wr-feedback-${sc.id}" class="hidden p-3.5 rounded-xl text-xs leading-relaxed"></div>
          </div>
        `;
      }).join("");

      const randomDrillHTML = currentRandomQuiz ? `
        <section class="card-tile p-4 sm:p-5 border-sky-500/35 space-y-3">
          <div class="flex items-center justify-between gap-2">
            <div>
              <span class="text-[11px] font-mono uppercase tracking-wider text-sky-400 font-bold">Rapid-Fire Certification Drill</span>
              <h2 class="text-base font-extrabold text-white">Adaptive Concept Check</h2>
            </div>
            <button onclick="nextRandomQuiz()" class="px-3 py-1.5 rounded-xl bg-elevated hover:bg-slate-700 text-xs font-semibold text-sky-300 border border-borderline">
              Next Question ↻
            </button>
          </div>

          <div class="text-[11px] text-slate-400">Source: Track ${currentRandomQuiz.trackNumber} • ${currentRandomQuiz.title}</div>
          <p class="text-sm font-bold text-white">${currentRandomQuiz.quiz.question}</p>

          <div class="space-y-2">
            ${currentRandomQuiz.quiz.options.map((opt, idx) => `
              <button onclick="evaluateRandomDrill(${idx})" class="w-full text-left p-3 rounded-xl bg-void hover:bg-elevated border border-borderline text-xs sm:text-sm text-slate-200 transition flex items-start gap-2">
                <span class="font-mono font-bold text-sky-400">${String.fromCharCode(65 + idx)}.</span>
                <span>${opt}</span>
              </button>
            `).join("")}
          </div>

          <div id="random-drill-feedback" class="hidden p-3.5 rounded-xl text-xs leading-relaxed"></div>
        </section>
      ` : "";

      return `
        <div class="space-y-5">
          <div>
            <h1 class="text-xl font-extrabold text-white">Ad Ops Practice Lab</h1>
            <p class="text-xs text-slate-400">Test your troubleshooting instincts on live outage scenarios &amp; rapid drills</p>
          </div>

          ${randomDrillHTML}

          <section class="space-y-3">
            <h2 class="text-base font-extrabold text-white">War-Room Incident Scenarios (${solvedSet.size}/${WAR_ROOM_SCENARIOS.length} Resolved)</h2>
            <div class="space-y-3.5">
              ${scenariosHTML}
            </div>
          </section>
        </div>
      `;
    }

    function evaluateWarRoomChoice(scenarioId, choiceIdx) {
      const scenario = WAR_ROOM_SCENARIOS.find(s => s.id === scenarioId);
      if (!scenario) return;
      const choice = scenario.choices[choiceIdx];
      const fb = document.getElementById(`wr-feedback-${scenarioId}`);
      if (fb) {
        fb.classList.remove("hidden");
        fb.className = `p-3.5 rounded-xl text-xs leading-relaxed border ${choice.isCorrect ? 'bg-emerald-500/15 border-emerald-500/40 text-emerald-200' : 'bg-rose-500/15 border-rose-500/40 text-rose-200'}`;
        fb.innerHTML = `<strong>${choice.isCorrect ? "✓ Incident Resolved!" : "✕ Diagnostic Error:"}</strong> ${choice.feedback}`;
      }
      if (choice.isCorrect && !appState.practiceCompleted.includes(scenarioId)) {
        appState.practiceCompleted.push(scenarioId);
        saveState();
        showToast("War-Room scenario resolved!", "emerald");
      }
    }

    function nextRandomQuiz() {
      currentRandomQuiz = generateRandomQuizQuestion();
      renderCurrentView();
    }

    function evaluateRandomDrill(idx) {
      if (!currentRandomQuiz) return;
      const isCorrect = idx === currentRandomQuiz.quiz.correctIndex;
      const fb = document.getElementById("random-drill-feedback");
      if (fb) {
        fb.classList.remove("hidden");
        fb.className = `p-3.5 rounded-xl text-xs leading-relaxed border ${isCorrect ? 'bg-emerald-500/15 border-emerald-500/40 text-emerald-200' : 'bg-rose-500/15 border-rose-500/40 text-rose-200'}`;
        fb.innerHTML = `<strong>${isCorrect ? "✓ Correct!" : "✕ Incorrect."}</strong> ${currentRandomQuiz.quiz.explanation}`;
      }
    }

    /* =========================================================================
       13. VIEW 6: PROGRESS, BOOKMARKS, NOTES & JSON BACKUP
       ========================================================================= */
    function renderProgressView() {
      const allLessons = getAllLessonsFlat();
      const completedSet = new Set(appState.completedLessons);
      const bookmarkedLessons = allLessons.filter(l => appState.bookmarkedLessons.includes(l.id));
      const notesEntries = Object.entries(appState.lessonNotes || {}).filter(([_, text]) => (text || "").trim().length > 0);

      const completedCount = allLessons.filter(l => completedSet.has(l.id)).length;
      const pct = allLessons.length ? Math.round((completedCount / allLessons.length) * 100) : 0;

      const bookmarksHTML = bookmarkedLessons.length
        ? bookmarkedLessons.map(l => `
            <div onclick="openLesson('${l.id}')" class="p-3 rounded-xl bg-void border border-borderline hover:border-amber-400/40 cursor-pointer flex items-center justify-between gap-2">
              <div>
                <div class="text-xs font-bold text-white">${l.title}</div>
                <div class="text-[11px] text-slate-400">Track ${l.trackNumber} • ${l.trackLevel}</div>
              </div>
              <span class="text-xs text-amber-400 font-semibold">Open →</span>
            </div>
          `).join("")
        : `<p class="text-xs text-slate-400">No bookmarked lessons yet. Star any lesson while studying for quick revision.</p>`;

      const notesHTML = notesEntries.length
        ? notesEntries.map(([lessonId, noteText]) => {
            const lesson = findLessonById(lessonId);
            return `
              <div onclick="openLesson('${lessonId}')" class="p-3 rounded-xl bg-void border border-borderline hover:border-sky-400/40 cursor-pointer space-y-1">
                <div class="text-xs font-bold text-sky-300">${lesson.title}</div>
                <p class="text-xs text-slate-300 whitespace-pre-line line-clamp-3">${noteText}</p>
              </div>
            `;
          }).join("")
        : `<p class="text-xs text-slate-400">Your personal study notes will appear here automatically as you write them inside lessons.</p>`;

      return `
        <div class="space-y-5">
          <div>
            <h1 class="text-xl font-extrabold text-white">Mastery Tracker &amp; Study Vault</h1>
            <p class="text-xs text-slate-400">Offline-ready progress stored locally on your device</p>
          </div>

          <!-- Stats Summary Cards -->
          <div class="grid grid-cols-3 gap-2.5">
            <div class="card-tile p-3.5 text-center">
              <div class="text-xl font-extrabold text-emerald-400">${pct}%</div>
              <div class="text-[11px] text-slate-400 mt-0.5">Curriculum</div>
            </div>
            <div class="card-tile p-3.5 text-center">
              <div class="text-xl font-extrabold text-sky-400">${completedCount}/${allLessons.length}</div>
              <div class="text-[11px] text-slate-400 mt-0.5">Lessons Done</div>
            </div>
            <div class="card-tile p-3.5 text-center">
              <div class="text-xl font-extrabold text-amber-400">${appState.streakDays || 1}d 🔥</div>
              <div class="text-[11px] text-slate-400 mt-0.5">Study Streak</div>
            </div>
          </div>

          <!-- Bookmarked Lessons -->
          <section class="card-tile p-4 space-y-2.5">
            <h2 class="text-sm font-extrabold text-white">★ Bookmarked Lessons (${bookmarkedLessons.length})</h2>
            <div class="space-y-2">${bookmarksHTML}</div>
          </section>

          <!-- Personal Study Notes -->
          <section class="card-tile p-4 space-y-2.5">
            <h2 class="text-sm font-extrabold text-white">📝 My Study Notes (${notesEntries.length})</h2>
            <div class="space-y-2">${notesHTML}</div>
          </section>

          <!-- Backup & Restore (GitHub Pages / APK Portability) -->
          <section class="card-tile p-4 space-y-3">
            <div>
              <h2 class="text-sm font-extrabold text-white">Portable Progress Backup (JSON)</h2>
              <p class="text-xs text-slate-400">Export your progress, notes, and custom modules when moving from GitHub Pages to your Android APK.</p>
            </div>
            <div class="flex flex-wrap gap-2">
              <button onclick="exportProgressJSON()" class="px-3.5 py-2 rounded-xl bg-sky-500 hover:bg-sky-400 text-void text-xs font-bold">
                ⬇ Export Backup JSON
              </button>
              <label class="px-3.5 py-2 rounded-xl bg-elevated hover:bg-slate-700 text-slate-200 border border-borderline text-xs font-semibold cursor-pointer">
                ⬆ Import Backup JSON
                <input type="file" accept=".json" onchange="importProgressJSON(event)" class="hidden" />
              </label>
            </div>
          </section>
        </div>
      `;
    }

    function exportProgressJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appState, null, 2));
      const a = document.createElement("a");
      a.setAttribute("href", dataStr);
      a.setAttribute("download", `adops-academy-backup-${new Date().toISOString().slice(0, 10)}.json`);
      document.body.appendChild(a);
      a.click();
      a.remove();
      showToast("Backup JSON downloaded!", "emerald");
    }

    function importProgressJSON(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          appState = { ...DEFAULT_STATE, ...imported };
          saveState();
          renderCurrentView();
          showToast("Progress restored successfully!", "emerald");
        } catch (err) {
          showToast("Invalid backup JSON file.", "rose");
        }
      };
      reader.readAsText(file);
    }

    /* =========================================================================
       14. GLOBAL INSTANT SEARCH & CUSTOM MODULE CREATOR
       ========================================================================= */
    function handleGlobalSearch(rawQuery) {
      const query = (rawQuery || "").trim().toLowerCase();
      const dropdown = document.getElementById("global-search-results");
      const clearBtn = document.getElementById("clear-search-btn");

      if (!query) {
        dropdown.classList.add("hidden");
        clearBtn.classList.add("hidden");
        return;
      }

      clearBtn.classList.remove("hidden");

      const lessonMatches = getAllLessonsFlat().filter(l =>
        l.title.toLowerCase().includes(query) ||
        l.intuition.toLowerCase().includes(query) ||
        (l.jargons || []).some(j => j.term.toLowerCase().includes(query) || j.desc.toLowerCase().includes(query))
      ).slice(0, 5);

      const jargonMatches = JARGON_VAULT.filter(j =>
        j.term.toLowerCase().includes(query) ||
        j.full.toLowerCase().includes(query) ||
        j.meaning.toLowerCase().includes(query)
      ).slice(0, 4);

      if (!lessonMatches.length && !jargonMatches.length) {
        dropdown.innerHTML = `<div class="p-3.5 text-xs text-slate-400">No matching lessons or jargons for "${rawQuery}". Try adding it as a Custom Module!</div>`;
        dropdown.classList.remove("hidden");
        return;
      }

      const lessonsHTML = lessonMatches.map(l => `
        <button onclick="clearGlobalSearch(); openLesson('${l.id}')" class="w-full text-left p-3 hover:bg-elevated transition flex items-center justify-between gap-2">
          <div>
            <div class="text-xs font-bold text-white">${l.title}</div>
            <div class="text-[11px] text-slate-400">Track ${l.trackNumber} • ${l.trackLevel}</div>
          </div>
          <span class="text-[11px] font-semibold text-sky-400 shrink-0">Lesson →</span>
        </button>
      `).join("");

      const jargonsHTML = jargonMatches.map(j => `
        <button onclick="clearGlobalSearch(); setVaultFilter('${j.category}'); switchTab('vault')" class="w-full text-left p-3 hover:bg-elevated transition">
          <div class="flex items-center justify-between">
            <span class="text-xs font-mono font-bold text-emerald-300">${j.term} — ${j.full}</span>
            <span class="text-[10px] text-slate-400">${j.category}</span>
          </div>
          <div class="text-[11px] text-slate-300 truncate mt-0.5">${j.meaning}</div>
        </button>
      `).join("");

      dropdown.innerHTML = lessonsHTML + jargonsHTML;
      dropdown.classList.remove("hidden");
    }

    function clearGlobalSearch() {
      const input = document.getElementById("global-search-input");
      const dropdown = document.getElementById("global-search-results");
      const clearBtn = document.getElementById("clear-search-btn");
      if (input) input.value = "";
      if (dropdown) dropdown.classList.add("hidden");
      if (clearBtn) clearBtn.classList.add("hidden");
    }

    // Close search dropdown when clicking outside
    document.addEventListener("click", function(e) {
      const dropdown = document.getElementById("global-search-results");
      const input = document.getElementById("global-search-input");
      if (dropdown && input && !dropdown.contains(e.target) && e.target !== input) {
        dropdown.classList.add("hidden");
      }
    });

    function openCustomModuleModal(preselectTrackId = "track-1") {
      const modal = document.getElementById("custom-module-modal");
      const select = document.getElementById("custom-track-select");
      if (!modal || !select) return;

      select.innerHTML = BASE_CURRICULUM.map(t => `
        <option value="${t.id}" ${t.id === preselectTrackId ? "selected" : ""}>Track ${t.number}: ${t.title}</option>
      `).join("");

      modal.classList.remove("hidden");
    }

    function closeCustomModuleModal() {
      const modal = document.getElementById("custom-module-modal");
      if (modal) modal.classList.add("hidden");
    }

    function handleCreateCustomModule(event) {
      event.preventDefault();
      const trackId = document.getElementById("custom-track-select").value;
      const title = document.getElementById("custom-lesson-title").value.trim();
      const summary = document.getElementById("custom-lesson-summary").value.trim();
      const stepsRaw = document.getElementById("custom-lesson-steps").value.trim();

      const steps = stepsRaw
        ? stepsRaw.split("\n").map(s => s.replace(/^\d+[\.\)]\s*/, "").trim()).filter(Boolean)
        : ["Apply standard naming taxonomy and verify tracking tags prior to launch."];

      const newLesson = {
        id: "custom-" + Date.now(),
        title,
        duration: "Custom Module",
        difficulty: "On-Demand",
        intuition: summary,
        exampleTitle: "Applied Operational Scenario",
        exampleBody: summary,
        diagramType: "workflow",
        jargons: [],
        steps,
        gotchas: ["Verify tags, UTMs, and flight time zones before activating live spend."]
      };

      appState.customLessons = appState.customLessons || [];
      appState.customLessons.push({ trackId, lesson: newLesson });
      saveState();

      document.getElementById("custom-lesson-title").value = "";
      document.getElementById("custom-lesson-summary").value = "";
      document.getElementById("custom-lesson-steps").value = "";
      closeCustomModuleModal();
      showToast("Custom lesson added to curriculum!", "emerald");
      openLesson(newLesson.id);
    }

    /* =========================================================================
       15. BOOT APPLICATION ON WINDOW LOAD
       ========================================================================= */
    window.onload = function() {
      updateHeaderMetrics();
      updateBottomNavUI();
      renderCurrentView();
    };
  </script>
