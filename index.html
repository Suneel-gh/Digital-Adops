<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0B0F19" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="AdOps Mastery Academy — Self-Contained Digital Marketing, Ad Operations & Programmatic Ad Tech Training Platform" />
  <title>AdOps Mastery Academy — Technical Training Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          },
          colors: {
            void: '#0B0F19',
            surface: '#111827',
            elevated: '#182235',
            borderline: '#1F2937',
            skyaccent: '#38BDF8',
            amberaccent: '#F59E0B',
            emeraldaccent: '#10B981',
            roseaccent: '#F43F5E'
          }
        }
      }
    };
  </script>
  <style>
    :root {
      --bg-void: #0B0F19;
      --bg-surface: #111827;
      --bg-elevated: #182235;
      --border-subtle: #1F2937;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-void);
      color: #F3F4F6;
      font-family: 'Inter', system-ui, sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0B0F19; }
    ::-webkit-scrollbar-thumb { background: #1F2937; border-radius: 999px; }

    .lesson-prose p {
      font-size: 0.98rem;
      line-height: 1.82;
      color: #E5E7EB;
      margin-bottom: 1.15rem;
    }

    .lesson-prose h3 {
      font-size: 1.08rem;
      font-weight: 800;
      color: #38BDF8;
      margin-top: 1.75rem;
      margin-bottom: 0.65rem;
      letter-spacing: -0.01em;
    }

    .lesson-prose h4 {
      font-size: 0.96rem;
      font-weight: 700;
      color: #FCD34D;
      margin-top: 1.25rem;
      margin-bottom: 0.45rem;
    }

    /* Interactive Inline Jargon Hyperlinks */
    .jargon-link {
      color: #38BDF8;
      background: rgba(56, 189, 248, 0.11);
      border-bottom: 1.5px dashed rgba(245, 158, 11, 0.85);
      padding: 0.05rem 0.34rem;
      border-radius: 0.35rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline;
      text-decoration: none;
    }

    .jargon-link:hover, .jargon-link:focus {
      background: rgba(245, 158, 11, 0.22);
      color: #FCD34D;
      border-bottom-color: #F59E0B;
      outline: none;
    }

    .card-tile {
      background: linear-gradient(180deg, rgba(24, 34, 53, 0.72) 0%, rgba(17, 24, 39, 0.98) 100%);
      border: 1px solid #1F2937;
      border-radius: 1rem;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }

    .card-tile:hover {
      border-color: rgba(56, 189, 248, 0.42);
      box-shadow: 0 10px 28px -12px rgba(0, 0, 0, 0.72);
    }

    .header-blur {
      background: rgba(11, 15, 25, 0.93);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid #1F2937;
      padding-top: env(safe-area-inset-top, 0px);
    }

    .bottom-nav-blur {
      background: rgba(11, 15, 25, 0.95);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid #1F2937;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    .fade-in {
      animation: fadeIn 0.2s ease-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-void text-gray-100 antialiased selection:bg-sky-500/30 selection:text-sky-200">

  <!-- TOP STICKY HEADER -->
  <header class="header-blur sticky top-0 z-40">
    <div class="max-w-4xl mx-auto px-4 py-3">
      <div class="flex items-center justify-between gap-3">
        <!-- Brand -->
        <button onclick="navigateTo('curriculum')" class="flex items-center gap-2.5 text-left focus:outline-none group">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-sky-400 via-amber-400 to-emerald-400 p-[1.5px] shrink-0 shadow-lg shadow-sky-500/15">
            <div class="w-full h-full bg-void rounded-[10px] flex items-center justify-center">
              <svg class="w-5 h-5 text-sky-400 group-hover:scale-110 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
              </svg>
            </div>
          </div>
          <div>
            <div class="flex items-center gap-1.5">
              <span class="font-extrabold text-base tracking-tight text-white">AdOps Mastery Academy</span>
              <span class="text-[10px] font-mono uppercase tracking-wider px-1.5 py-0.5 rounded bg-sky-500/15 text-sky-300 border border-sky-500/30">Self-Paced Curriculum</span>
            </div>
            <p class="text-[11px] text-gray-400 leading-tight">Digital Marketing, Ad Operations &amp; Programmatic Engineering</p>
          </div>
        </button>

        <!-- Progress Badge -->
        <button onclick="navigateTo('progress')" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-surface border border-borderline text-xs font-semibold text-emerald-400 hover:border-emerald-500/40 transition" title="Curriculum Mastery Progress">
          <span id="header-mastery">0 / 0 Topics</span>
        </button>
      </div>

      <!-- Global Search Across Curriculum & Jargon Encyclopedia -->
      <div class="relative mt-2.5">
        <div class="relative flex items-center">
          <svg class="w-4 h-4 text-gray-400 absolute left-3.5 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11A6 6 0 115 11a6 6 0 0112 0z" />
          </svg>
          <input
            id="global-search-input"
            type="text"
            placeholder="Search technical topics or jargons (OpenRTB, Prebid, Bid Shading, OMID, SIVT, Shapley, Geo-Lift...)"
            oninput="handleGlobalSearch(this.value)"
            onfocus="handleGlobalSearch(this.value)"
            class="w-full bg-surface text-sm text-gray-100 placeholder-gray-400 pl-10 pr-9 py-2.5 rounded-xl border border-borderline focus:outline-none focus:border-sky-400 transition"
          />
          <button id="clear-search-btn" onclick="clearGlobalSearch()" class="hidden absolute right-3 text-gray-400 hover:text-white p-1" aria-label="Clear search">✕</button>
        </div>
        <div id="global-search-dropdown" class="hidden absolute left-0 right-0 mt-1.5 bg-surface border border-borderline rounded-2xl shadow-2xl max-h-80 overflow-y-auto z-50 divide-y divide-borderline"></div>
      </div>
    </div>
  </header>

  <!-- TOAST NOTIFICATIONS -->
  <div id="toast-container" class="fixed top-24 right-4 z-50 flex flex-col gap-2 pointer-events-none max-w-xs w-full"></div>

  <!-- MAIN APPLICATION CANVAS -->
  <main class="max-w-4xl mx-auto px-4 pt-4 pb-28">
    <div id="view-root" class="fade-in"></div>
  </main>

  <!-- BOTTOM 4-TAB NAVIGATION BAR -->
  <nav class="bottom-nav-blur fixed bottom-0 left-0 right-0 z-40">
    <div class="max-w-4xl mx-auto px-2 py-1.5 grid grid-cols-4 gap-1">
      <button onclick="navigateTo('curriculum')" data-nav="curriculum" class="nav-tab flex flex-col items-center justify-center py-1.5 px-1 rounded-xl text-sky-400 bg-sky-500/10 transition">
        <svg class="w-5 h-5 mb-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h10" />
        </svg>
        <span class="text-[11px] font-semibold">Curriculum</span>
      </button>

      <button onclick="navigateTo('encyclopedia')" data-nav="encyclopedia" class="nav-tab flex flex-col items-center justify-center py-1.5 px-1 rounded-xl text-gray-400 hover:text-gray-200 transition">
        <svg class="w-5 h-5 mb-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
        </svg>
        <span class="text-[11px] font-medium">Jargons</span>
      </button>

      <button onclick="navigateTo('lab')" data-nav="lab" class="nav-tab flex flex-col items-center justify-center py-1.5 px-1 rounded-xl text-gray-400 hover:text-gray-200 transition">
        <svg class="w-5 h-5 mb-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
        </svg>
        <span class="text-[11px] font-medium">Practice Lab</span>
      </button>

      <button onclick="navigateTo('progress')" data-nav="progress" class="nav-tab flex flex-col items-center justify-center py-1.5 px-1 rounded-xl text-gray-400 hover:text-gray-200 transition">
        <svg class="w-5 h-5 mb-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span class="text-[11px] font-medium">Sources &amp; Vault</span>
      </button>
    </div>
  </nav>

  <!-- MODAL: ADD NEW TOPIC OR JARGON ENTRY -->
  <div id="expand-modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-4">
    <div class="bg-surface border border-borderline rounded-2xl w-full max-w-lg p-5 shadow-2xl max-h-[90vh] overflow-y-auto fade-in">
      <div class="flex items-center justify-between mb-4">
        <div>
          <h3 class="text-lg font-extrabold text-white">Add Custom Training Material</h3>
          <p class="text-xs text-gray-400">Append new technical modules or encyclopedia entries to your local library</p>
        </div>
        <button onclick="closeExpandModal()" class="p-2 rounded-xl bg-elevated text-gray-400 hover:text-white">✕</button>
      </div>

      <div class="grid grid-cols-2 gap-2 mb-4 bg-void p-1 rounded-xl border border-borderline">
        <button id="mode-btn-topic" onclick="setExpandModalMode('topic')" class="py-2 rounded-lg text-xs font-bold bg-sky-500 text-void">New Technical Topic</button>
        <button id="mode-btn-jargon" onclick="setExpandModalMode('jargon')" class="py-2 rounded-lg text-xs font-bold text-gray-300">New Jargon Entry</button>
      </div>

      <!-- Form A: Add New Technical Topic -->
      <form id="form-new-topic" onsubmit="saveCustomTopic(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-gray-300 mb-1">Proficiency Module</label>
          <select id="custom-tp-level" class="w-full bg-void border border-borderline rounded-xl px-3 py-2.5 text-sm text-white focus:border-sky-400 focus:outline-none">
            <option value="level-1">1. Beginner — Core Ecosystem &amp; Channels</option>
            <option value="level-2">2. Intermediate — Ad Servers, DSPs, SSPs, RTB &amp; Header Bidding</option>
            <option value="level-3">3. Expert — Yield, Viewability, IVT &amp; Discrepancy Forensics</option>
            <option value="level-4">4. Professional — Attribution, Incrementality, Privacy &amp; Governance</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-300 mb-1">Topic Title</label>
          <input id="custom-tp-title" type="text" required placeholder="e.g., Custom Bidding Algorithms &amp; Value Rules in DV360" class="w-full bg-void border border-borderline rounded-xl px-3 py-2.5 text-sm text-white focus:border-sky-400 focus:outline-none" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-300 mb-1">Core Technical Content (Recognized jargons link automatically)</label>
          <textarea id="custom-tp-body" rows="6" required placeholder="Enter detailed technical mechanics, workflow steps, formulas, and operational rules..." class="w-full bg-void border border-borderline rounded-xl px-3 py-2.5 text-sm text-white focus:border-sky-400 focus:outline-none"></textarea>
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeExpandModal()" class="px-4 py-2.5 rounded-xl bg-elevated text-gray-300 text-xs font-semibold">Cancel</button>
          <button type="submit" class="px-4 py-2.5 rounded-xl bg-sky-500 hover:bg-sky-400 text-void text-xs font-extrabold">Save Topic</button>
        </div>
      </form>

      <!-- Form B: Add New Jargon Entry -->
      <form id="form-new-jargon" onsubmit="saveCustomJargon(event)" class="hidden space-y-3">
        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <label class="block text-xs font-semibold text-gray-300 mb-1">Jargon Term / Acronym</label>
            <input id="custom-jg-term" type="text" required placeholder="e.g., SPO" class="w-full bg-void border border-borderline rounded-xl px-3 py-2.5 text-sm text-white focus:border-sky-400 focus:outline-none" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-300 mb-1">Full Expansion</label>
            <input id="custom-jg-full" type="text" required placeholder="e.g., Supply Path Optimization" class="w-full bg-void border border-borderline rounded-xl px-3 py-2.5 text-sm text-white focus:border-sky-400 focus:outline-none" />
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-300 mb-1">Domain Category</label>
          <select id="custom-jg-cat" class="w-full bg-void border border-borderline rounded-xl px-3 py-2.5 text-sm text-white focus:border-sky-400 focus:outline-none">
            <option value="Ecosystem">Ecosystem</option>
            <option value="Platforms">Platforms</option>
            <option value="Auctions">Auctions</option>
            <option value="Metrics & Pricing">Metrics &amp; Pricing</option>
            <option value="Tracking & Data">Tracking &amp; Data</option>
            <option value="Verification">Verification</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-300 mb-1">Concise Definition</label>
          <textarea id="custom-jg-def" rows="2" required placeholder="Clear technical definition..." class="w-full bg-void border border-borderline rounded-xl px-3 py-2.5 text-sm text-white focus:border-sky-400 focus:outline-none"></textarea>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-300 mb-1">Technical Mechanics &amp; Implementation</label>
          <textarea id="custom-jg-mech" rows="3" required placeholder="Detailed operational and protocol mechanics..." class="w-full bg-void border border-borderline rounded-xl px-3 py-2.5 text-sm text-white focus:border-sky-400 focus:outline-none"></textarea>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-300 mb-1">Formula &amp; Source Reference</label>
          <input id="custom-jg-formula" type="text" placeholder="e.g., IAB OpenRTB 2.6 • Net Take Rate % = (Gross Bid - Publisher Payout) / Gross Bid" class="w-full bg-void border border-borderline rounded-xl px-3 py-2.5 text-sm text-white focus:border-sky-400 focus:outline-none" />
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeExpandModal()" class="px-4 py-2.5 rounded-xl bg-elevated text-gray-300 text-xs font-semibold">Cancel</button>
          <button type="submit" class="px-4 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-void text-xs font-extrabold">Save Jargon</button>
        </div>
      </form>
    </div>
  </div>

  <script>

    /* =========================================================================
       5. STATE & PERSISTENCE (WITH BACK-STACK & JSON EXPORT/IMPORT)
       ========================================================================= */
    const STORAGE_KEY = "adops_academy_platform_v4";

    const DEFAULT_STATE = {
      currentView: "curriculum", // 'curriculum' | 'topic' | 'jargon' | 'encyclopedia' | 'lab' | 'progress'
      activeModuleId: "level-2", // Default to Intermediate so expanded RTB/HB lessons are immediately visible
      activeTopicId: "int-rtb-auctions",
      lastTopicId: "int-rtb-auctions",
      activeJargonId: null,
      navHistory: [],
      completedTopics: [],
      bookmarkedTopics: [],
      topicNotes: {},
      customTopics: [],
      customJargons: [],
      encyclopediaFilter: "All"
    };

    let state = loadState();

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) return { ...DEFAULT_STATE };
        const parsed = JSON.parse(saved);
        return { ...DEFAULT_STATE, ...parsed, navHistory: [] };
      } catch (e) {
        return { ...DEFAULT_STATE };
      }
    }

    function saveState() {
      try {
        const toPersist = { ...state, navHistory: [] };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(toPersist));
        updateHeaderStats();
      } catch (e) {
        showToast("Could not persist progress locally.", "rose");
      }
    }

    function getAllModules() {
      return CURRICULUM_MODULES.map(mod => {
        const extras = (state.customTopics || []).filter(t => t.moduleId === mod.id);
        return {
          ...mod,
          topics: [...mod.topics, ...extras]
        };
      });
    }

    function getAllTopics() {
      return getAllModules().flatMap(m => m.topics);
    }

    function findTopicById(id) {
      return getAllTopics().find(t => t.id === id) || getAllTopics()[0];
    }

    function getAllJargons() {
      return [...BASE_JARGON_ENCYCLOPEDIA, ...(state.customJargons || [])];
    }

    function findJargonByIdOrTerm(key) {
      const normalized = (key || "").trim().toLowerCase();
      return getAllJargons().find(j =>
        j.id.toLowerCase() === normalized ||
        j.term.toLowerCase() === normalized ||
        (j.aliases || []).some(a => a.toLowerCase() === normalized)
      );
    }

    function updateHeaderStats() {
      const total = getAllTopics().length;
      const done = (state.completedTopics || []).length;
      const mEl = document.getElementById("header-mastery");
      if (mEl) mEl.textContent = `${done} / ${total} Topics`;
    }

    function showToast(msg, tone = "sky") {
      const box = document.getElementById("toast-container");
      if (!box) return;
      const colors = {
        sky: "border-sky-500/40 bg-surface text-sky-200",
        emerald: "border-emerald-500/40 bg-surface text-emerald-200",
        amber: "border-amber-500/40 bg-surface text-amber-200",
        rose: "border-rose-500/40 bg-surface text-rose-200"
      };
      const el = document.createElement("div");
      el.className = `pointer-events-auto px-3.5 py-2.5 rounded-xl border shadow-xl text-xs font-semibold fade-in ${colors[tone] || colors.sky}`;
      el.textContent = msg;
      box.appendChild(el);
      setTimeout(() => {
        el.style.opacity = "0";
        el.style.transition = "opacity 0.25s ease";
        setTimeout(() => el.remove(), 260);
      }, 2400);
    }

    /* =========================================================================
       6. AUTOMATIC INLINE JARGON PARSER & HYPERLINKER
       ========================================================================= */
    function linkifyJargons(rawText) {
      if (!rawText) return "";
      const allJargons = getAllJargons();
      const tokenPairs = [];
      allJargons.forEach(j => {
        tokenPairs.push({ label: j.term, id: j.id });
        (j.aliases || []).forEach(alias => tokenPairs.push({ label: alias, id: j.id }));
      });
      tokenPairs.sort((a, b) => b.label.length - a.label.length);
      const escaped = tokenPairs.map(p => p.label.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
      if (!escaped.length) return rawText;
      const regex = new RegExp(`\\b(${escaped.join("|")})\\b`, "g");

      return rawText.replace(regex, match => {
        const found = findJargonByIdOrTerm(match);
        if (!found) return match;
        return `<button type="button" onclick="openJargonPage('${found.id}')" class="jargon-link" title="Open ${found.term} (${found.full}) Reference">${match}</button>`;
      });
    }

    /* =========================================================================
       7. NAVIGATION ROUTER WITH BACK-STACK
       ========================================================================= */
    function navigateTo(view, params = {}, pushHistory = true) {
      if (pushHistory && state.currentView) {
        state.navHistory.push({
          view: state.currentView,
          moduleId: state.activeModuleId,
          topicId: state.activeTopicId,
          jargonId: state.activeJargonId,
          scrollY: window.scrollY
        });
      }

      state.currentView = view;
      if (params.moduleId !== undefined) state.activeModuleId = params.moduleId;
      if (params.topicId !== undefined) {
        state.activeTopicId = params.topicId;
        state.lastTopicId = params.topicId;
        const foundT = findTopicById(params.topicId);
        if (foundT) state.activeModuleId = foundT.moduleId;
      }
      if (params.jargonId !== undefined) state.activeJargonId = params.jargonId;

      saveState();
      updateNavTabs();
      renderView();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function openTopic(topicId) {
      navigateTo("topic", { topicId }, true);
    }

    function openJargonPage(jargonIdOrTerm) {
      const found = findJargonByIdOrTerm(jargonIdOrTerm);
      if (!found) return;
      navigateTo("jargon", { jargonId: found.id }, true);
    }

    function navigateBack() {
      const prev = state.navHistory.pop();
      if (!prev) {
        navigateTo("curriculum", {}, false);
        return;
      }
      state.currentView = prev.view;
      state.activeModuleId = prev.moduleId;
      state.activeTopicId = prev.topicId;
      state.activeJargonId = prev.jargonId;
      updateNavTabs();
      renderView();
      setTimeout(() => window.scrollTo({ top: prev.scrollY || 0, behavior: "instant" }), 20);
    }

    function updateNavTabs() {
      let activeTabKey = state.currentView;
      if (activeTabKey === "topic") activeTabKey = "curriculum";
      if (activeTabKey === "jargon") activeTabKey = "encyclopedia";

      document.querySelectorAll(".nav-tab").forEach(btn => {
        const key = btn.getAttribute("data-nav");
        if (key === activeTabKey) {
          btn.classList.remove("text-gray-400");
          btn.classList.add("text-sky-400", "bg-sky-500/10");
        } else {
          btn.classList.remove("text-sky-400", "bg-sky-500/10");
          btn.classList.add("text-gray-400");
        }
      });
    }

    function renderView() {
      const root = document.getElementById("view-root");
      if (!root) return;

      root.classList.remove("fade-in");
      void root.offsetWidth;
      root.classList.add("fade-in");

      switch (state.currentView) {
        case "curriculum":
          root.innerHTML = renderCurriculumHub();
          break;
        case "topic":
          root.innerHTML = renderTopicReader(state.activeTopicId);
          break;
        case "jargon":
          root.innerHTML = renderJargonDeepDivePage(state.activeJargonId);
          break;
        case "encyclopedia":
          root.innerHTML = renderJargonEncyclopediaDirectory();
          break;
        case "lab":
          root.innerHTML = renderPracticeLabView();
          attachCalculatorEvents();
          break;
        case "progress":
          root.innerHTML = renderSourcesAndVaultView();
          break;
        default:
          root.innerHTML = renderCurriculumHub();
      }
    }

    function toggleTopicComplete(topicId) {
      const idx = state.completedTopics.indexOf(topicId);
      if (idx === -1) {
        state.completedTopics.push(topicId);
        showToast("Topic marked complete!", "emerald");
      } else {
        state.completedTopics.splice(idx, 1);
      }
      saveState();
      renderView();
    }

    function toggleTopicBookmark(topicId) {
      const idx = state.bookmarkedTopics.indexOf(topicId);
      if (idx === -1) {
        state.bookmarkedTopics.push(topicId);
        showToast("Topic bookmarked!", "amber");
      } else {
        state.bookmarkedTopics.splice(idx, 1);
      }
      saveState();
      renderView();
    }

    function saveTopicNote(topicId, val) {
      state.topicNotes[topicId] = val;
      saveState();
      const st = document.getElementById("topic-note-status");
      if (st) st.textContent = "Saved ✓";
    }

    function evaluateTopicQuiz(topicId, qIdx, optIdx) {
      const topic = findTopicById(topicId);
      const q = topic.quiz?.[qIdx];
      if (!q) return;
      const isRight = optIdx === q.correctIndex;
      const fb = document.getElementById(`topic-quiz-fb-${topicId}-${qIdx}`);
      if (fb) {
        fb.classList.remove("hidden");
        fb.className = `p-3 rounded-lg text-xs leading-relaxed border ${isRight ? 'bg-emerald-500/15 border-emerald-500/40 text-emerald-200' : 'bg-rose-500/15 border-rose-500/40 text-rose-200'}`;
        fb.innerHTML = `<strong>${isRight ? "✓ Correct:" : "✕ Review:"}</strong> ${linkifyJargons(q.explanation)}`;
      }
      if (isRight && !state.completedTopics.includes(topicId)) {
        state.completedTopics.push(topicId);
        saveState();
        showToast("Quiz passed — topic marked complete!", "emerald");
      }
    }

    function resetLabCalc() {
      document.getElementById("lab-spend").value = 2400;
      document.getElementById("lab-imps").value = 480000;
      document.getElementById("lab-vimps").value = 336000;

    function computeLabNumbers() {
      const spend = parseFloat(document.getElementById("lab-spend")?.value) || 0;
      const imps = parseFloat(document.getElementById("lab-imps")?.value) || 0;
      const vimps = parseFloat(document.getElementById("lab-vimps")?.value) || 0;
      const clicks = parseFloat(document.getElementById("lab-clicks")?.value) || 0;
      const convs = parseFloat(document.getElementById("lab-convs")?.value) || 0;
      const rev = parseFloat(document.getElementById("lab-rev")?.value) || 0;

      const cpm = imps > 0 ? (spend / imps) * 1000 : 0;
      const vcpm = vimps > 0 ? (spend / vimps) * 1000 : 0;
      const ctr = imps > 0 ? (clicks / imps) * 100 : 0;
      const cpc = clicks > 0 ? spend / clicks : 0;
      const cvr = clicks > 0 ? (convs / clicks) * 100 : 0;
      const cpa = convs > 0 ? spend / convs : 0;
      const roas = spend > 0 ? rev / spend : 0;

      if (document.getElementById("res-cpm")) document.getElementById("res-cpm").textContent = `$${cpm.toFixed(2)}`;
      if (document.getElementById("res-vcpm")) document.getElementById("res-vcpm").textContent = vimps > 0 ? `$${vcpm.toFixed(2)}` : "—";
      if (document.getElementById("res-ctr")) document.getElementById("res-ctr").textContent = `${ctr.toFixed(2)}%`;
      if (document.getElementById("res-cpc")) document.getElementById("res-cpc").textContent = `$${cpc.toFixed(2)}`;
      if (document.getElementById("res-cvr")) document.getElementById("res-cvr").textContent = `${cvr.toFixed(2)}%`;
      if (document.getElementById("res-cpa")) document.getElementById("res-cpa").textContent = convs > 0 ? `$${cpa.toFixed(2)}` : "—";
      if (document.getElementById("res-roas")) document.getElementById("res-roas").textContent = `${roas.toFixed(2)}x`;

      const dspImps = parseFloat(document.getElementById("disc-dsp")?.value) || 0;
      const asImps = parseFloat(document.getElementById("disc-as")?.value) || 0;
      const discOut = document.getElementById("disc-output");
      if (discOut && dspImps > 0) {
        const disc = ((dspImps - asImps) / dspImps) * 100;
        const absDisc = Math.abs(disc);
        discOut.textContent = `${disc.toFixed(2)}% (${absDisc <= 5 ? "Within ≤5%" : absDisc <= 10 ? "Monitor 5–10%" : "Audit >10%"})`;
        discOut.className = `text-sm font-mono font-bold ${absDisc <= 5 ? "text-emerald-400" : absDisc <= 10 ? "text-amber-400" : "text-rose-400"}`;
      }

      const testCvr = parseFloat(document.getElementById("inc-test")?.value) || 0;
      const ctrlCvr = parseFloat(document.getElementById("inc-ctrl")?.value) || 0;
      const expConvs = parseFloat(document.getElementById("inc-convs")?.value) || 0;
      const incSpend = parseFloat(document.getElementById("inc-spend")?.value) || 0;
      const incOut = document.getElementById("inc-output");
      if (incOut && ctrlCvr > 0 && testCvr >= ctrlCvr) {
        const liftPct = ((testCvr - ctrlCvr) / ctrlCvr) * 100;
        const incShare = (testCvr - ctrlCvr) / testCvr;
        const netIncConvs = Math.round(expConvs * incShare);
        const trueIcpa = netIncConvs > 0 ? incSpend / netIncConvs : 0;
        incOut.textContent = `+${liftPct.toFixed(2)}% Lift • ${netIncConvs.toLocaleString()} Incremental Convs • $${trueIcpa.toFixed(2)} True iCPA`;
      }
    }

              <h2 class="text-base font-extrabold text-white">Curriculum Reference Standards &amp; Platforms</h2>
              <p class="text-xs text-gray-400">Technical frameworks and official specifications integrated across all four curriculum modules:</p>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-2.5">
              ${sourcesCards}
            </div>
          </section>

          <section class="card-tile p-4 space-y-3">
            <h2 class="text-sm font-extrabold text-white">Expand Local Training Library</h2>
            <div class="flex flex-wrap gap-2">
              <button onclick="openExpandModal('topic', '${state.activeModuleId || 'level-2'}')" class="px-4 py-2 rounded-xl bg-sky-500 hover:bg-sky-400 text-void text-xs font-extrabold">
                + Add Custom Technical Topic
              </button>
              <button onclick="openExpandModal('jargon')" class="px-4 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-void text-xs font-extrabold">
                + Add New Jargon Reference
              </button>
            </div>
          </section>

          <section class="card-tile p-4 space-y-2.5">
            <h2 class="text-sm font-extrabold text-white">★ Bookmarked Topics (${bookmarkedList.length})</h2>
            <div class="space-y-2">${bookmarksHTML}</div>
          </section>

          <section class="card-tile p-4 space-y-2.5">
            <h2 class="text-sm font-extrabold text-white">Saved Topic Notes (${notesList.length})</h2>
            <div class="space-y-2">${notesHTML}</div>
          </section>

          <section class="card-tile p-4 space-y-3">
            <div>
              <h2 class="text-sm font-extrabold text-white">Portable Progress Backup (GitHub Pages ↔ Android APK)</h2>
              <p class="text-xs text-gray-400">Export or restore completed topics, custom modules, jargon entries, and notes as JSON.</p>
            </div>
            <div class="flex flex-wrap gap-2">
              <button onclick="exportBackupJSON()" class="px-3.5 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-void text-xs font-extrabold">
                ⬇ Export JSON Backup
              </button>
              <label class="px-3.5 py-2 rounded-xl bg-elevated hover:bg-gray-700 text-gray-200 border border-borderline text-xs font-semibold cursor-pointer">
                ⬆ Import JSON Backup
                <input type="file" accept=".json" onchange="importBackupJSON(event)" class="hidden" />
              </label>
            </div>
          </section>
        </div>
      `;
    }

    function exportBackupJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));
      const a = document.createElement("a");
      a.setAttribute("href", dataStr);
      a.setAttribute("download", `adops-academy-backup-${new Date().toISOString().slice(0, 10)}.json`);
      document.body.appendChild(a);
      a.click();
      a.remove();
      showToast("Backup JSON exported!", "emerald");
    }

    function importBackupJSON(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          state = { ...DEFAULT_STATE, ...imported, navHistory: [] };
          saveState();
          renderView();
          showToast("Progress restored from JSON!", "emerald");
        } catch (err) {
          showToast("Invalid JSON backup file.", "rose");
        }
      };
      reader.readAsText(file);
    }

    /* =========================================================================
       15. GLOBAL SEARCH & MODAL HANDLERS
       ========================================================================= */
    function handleGlobalSearch(raw) {
      const q = (raw || "").trim().toLowerCase();
      const dropdown = document.getElementById("global-search-dropdown");
      const clearBtn = document.getElementById("clear-search-btn");

      if (!q) {
        dropdown.classList.add("hidden");
        clearBtn.classList.add("hidden");
        return;
      }

      clearBtn.classList.remove("hidden");

      const jargonHits = getAllJargons().filter(j =>
        j.term.toLowerCase().includes(q) ||
        j.full.toLowerCase().includes(q) ||
        j.definition.toLowerCase().includes(q) ||
        (j.aliases || []).some(a => a.toLowerCase().includes(q))
      ).slice(0, 5);

      const topicHits = getAllTopics().filter(t =>
        t.title.toLowerCase().includes(q) ||
        t.category.toLowerCase().includes(q) ||
        t.sections.some(s => s.heading.toLowerCase().includes(q) || s.paragraphs.some(p => p.toLowerCase().includes(q)))
      ).slice(0, 4);

      if (!jargonHits.length && !topicHits.length) {
        dropdown.innerHTML = `<div class="p-3.5 text-xs text-gray-400">No match for "${raw}".</div>`;
        dropdown.classList.remove("hidden");
        return;
      }

      const jHTML = jargonHits.map(j => `
        <button onclick="clearGlobalSearch(); openJargonPage('${j.id}')" class="w-full text-left p-3 hover:bg-elevated transition flex items-center justify-between gap-2">
          <div>
            <span class="text-xs font-extrabold text-amber-300">${j.term}</span>
            <span class="text-xs text-gray-400 ml-1">(${j.full})</span>
            <div class="text-[11px] text-gray-300 truncate max-w-md mt-0.5">${j.definition}</div>
          </div>
          <span class="text-[11px] font-bold text-amber-400 shrink-0">Jargon →</span>
        </button>
      `).join("");

      const tHTML = topicHits.map(t => `
        <button onclick="clearGlobalSearch(); openTopic('${t.id}')" class="w-full text-left p-3 hover:bg-elevated transition flex items-center justify-between gap-2">
          <div>
            <div class="text-xs font-bold text-white">${t.title}</div>
            <div class="text-[11px] text-gray-400">${t.category}</div>
          </div>
          <span class="text-[11px] font-bold text-sky-400 shrink-0">Topic →</span>
        </button>
      `).join("");

      dropdown.innerHTML = jHTML + tHTML;
      dropdown.classList.remove("hidden");
    }

    function clearGlobalSearch() {
      const inp = document.getElementById("global-search-input");
      const drop = document.getElementById("global-search-dropdown");
      const clr = document.getElementById("clear-search-btn");
      if (inp) inp.value = "";
      if (drop) drop.classList.add("hidden");
      if (clr) clr.classList.add("hidden");
    }

    document.addEventListener("click", function(e) {
      const drop = document.getElementById("global-search-dropdown");
      const inp = document.getElementById("global-search-input");
      if (drop && inp && !drop.contains(e.target) && e.target !== inp) {
        drop.classList.add("hidden");
      }
    });

    function openExpandModal(mode = "topic", preselectMod = "level-2") {
      const modal = document.getElementById("expand-modal");
      const modSel = document.getElementById("custom-tp-level");
      if (!modal) return;
      if (modSel && preselectMod) modSel.value = preselectMod;
      setExpandModalMode(mode);
      modal.classList.remove("hidden");
    }

    function closeExpandModal() {
      const modal = document.getElementById("expand-modal");
      if (modal) modal.classList.add("hidden");
    }

    function setExpandModalMode(mode) {
      const btnTp = document.getElementById("mode-btn-topic");
      const btnJg = document.getElementById("mode-btn-jargon");
      const formTp = document.getElementById("form-new-topic");
      const formJg = document.getElementById("form-new-jargon");

      if (mode === "topic") {
        btnTp.className = "py-2 rounded-lg text-xs font-bold bg-sky-500 text-void";
        btnJg.className = "py-2 rounded-lg text-xs font-bold text-gray-300";
        formTp.classList.remove("hidden");
        formJg.classList.add("hidden");
      } else {
        btnJg.className = "py-2 rounded-lg text-xs font-bold bg-amber-500 text-void";
        btnTp.className = "py-2 rounded-lg text-xs font-bold text-gray-300";
        formJg.classList.remove("hidden");
        formTp.classList.add("hidden");
      }
    }

    function saveCustomTopic(e) {
      e.preventDefault();
      const moduleId = document.getElementById("custom-tp-level").value;
      const title = document.getElementById("custom-tp-title").value.trim();
      const rawBody = document.getElementById("custom-tp-body").value.trim();
      const paragraphs = rawBody.split(/\n+/).map(p => p.trim()).filter(Boolean);

      const newTopic = {
        id: "custom-tp-" + Date.now(),
        moduleId,
        title,
        category: "Custom Technical Module",
        diagramType: "ecosystem_flow",
        sources: ["IAB", "SKILLSHOP"],
        sourceCitations: ["Custom Technical Documentation"],
        sections: [{ heading: "1. Technical Overview & Mechanics", paragraphs }],
        quiz: []
      };

      state.customTopics = state.customTopics || [];
      state.customTopics.push(newTopic);
      saveState();

      document.getElementById("custom-tp-title").value = "";
      document.getElementById("custom-tp-body").value = "";
      closeExpandModal();
      showToast("New topic added to curriculum!", "emerald");
      openTopic(newTopic.id);
    }

    function saveCustomJargon(e) {
      e.preventDefault();
      const term = document.getElementById("custom-jg-term").value.trim();
      const full = document.getElementById("custom-jg-full").value.trim();
      const category = document.getElementById("custom-jg-cat").value;
      const definition = document.getElementById("custom-jg-def").value.trim();
      const mechanics = document.getElementById("custom-jg-mech").value.trim();
      const formula = document.getElementById("custom-jg-formula").value.trim();

      const newJargon = {
        id: "custom-jg-" + Date.now(),
        term,
        aliases: [],
        full,
        category,
        sourceRef: "Custom Technical Reference",
        definition,
        mechanics,
        formula: formula || "Operational Governance Rule",
        workedExample: "Applied across programmatic buying, serving, and verification workflows.",
        roles: {
          advertiser: "Applies this specification to improve campaign transparency and efficiency.",
          publisher: "Monitors this mechanism to protect inventory yield and quality.",
          adops: "Configures and audits this setting during pre-launch QA and mid-flight optimization."
        },
        pitfalls: ["Always reconcile settings across DSP and Ad Server reports."],
        related: ["Advertiser", "Publisher", "DSP", "SSP"]
      };

      state.customJargons = state.customJargons || [];
      state.customJargons.push(newJargon);
      saveState();

      document.getElementById("custom-jg-term").value = "";
      document.getElementById("custom-jg-full").value = "";
      document.getElementById("custom-jg-def").value = "";
      document.getElementById("custom-jg-mech").value = "";
      document.getElementById("custom-jg-formula").value = "";
      closeExpandModal();
      showToast("New jargon reference saved!", "amber");
      openJargonPage(newJargon.id);
    }

    /* =========================================================================
       16. BOOT APPLICATION ON WINDOW LOAD
       ========================================================================= */
    window.onload = function() {
      updateHeaderStats();
      updateNavTabs();
      renderView();
    };
  </script>
</body>
</html>
